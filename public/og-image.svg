<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Araviel — One chat, every model.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf9f3"/>
      <stop offset="100%" stop-color="#f7f0e6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e0d1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9e0d1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e9e0d1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#171717"/>
    <text x="36" y="36" text-anchor="middle" dominant-baseline="central" fill="#fdf9f3" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="600" font-size="40">A</text>
  </g>
  <text x="96" y="296" fill="#3d3528" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="88" letter-spacing="-2">Araviel</text>
  <text x="96" y="372" fill="#6e6354" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="500" font-size="34" letter-spacing="-0.5">One chat, every model.</text>
  <rect x="96" y="420" width="1008" height="1" fill="url(#rule)"/>
  <text x="96" y="484" fill="#6e6354" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="400" font-size="22">A multi-model AI workspace for chat, projects, images, and flow.</text>
  <text x="96" y="558" fill="#9e9283" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="500" font-size="18" letter-spacing="2">ARAVIEL.AI</text>
</svg>
